name: Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-assets.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  summary-cards:
    name: Summary cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

  animations:
    name: Snake + 3D contributions
    runs-on: ubuntu-latest
    needs: summary-cards
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folder
        run: mkdir -p assets

      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Copy 3D files
        run: cp profile-3d-contrib/*.svg assets/ || echo "No 3D files generated"

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
            assets/github-snake-blue.svg?color_snake=4FC3F7&color_dots=#0F2027,#1B3A4B,#2C5364,#3D7A94,#4FC3F7

      - name: List generated files
        run: |
          echo "== assets =="; ls -la assets || true
          echo "== summary cards =="; ls -R profile-summary-card-output 2>/dev/null | head -30 || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update profile assets [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
